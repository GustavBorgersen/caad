<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAAD</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <strong class="brand">CAAD</strong>
    <button id="open-folder" title="Open a local folder of build123d parts (Chrome/Edge)">Open folder…</button>
    <button id="reopen" hidden></button>
    <button id="examples">Examples</button>
    <span id="project-name" class="muted"></span>
    <span class="spacer"></span>
    <span id="status" class="muted"></span>
    <button id="agent-button"><span class="dot"></span>Agent</button>
  </header>
  <main>
    <aside id="left">
      <button id="toggle-left" class="panel-toggle" title="Compact timeline">«</button>
      <section id="parts-section">
        <h2>Projects <span class="actions"><button id="new-project" class="small" title="A new project: a folder with a pyproject.toml and parts/">New project</button><button id="new-part" class="small" title="A new part in the open project's parts/">+ Part</button></span></h2>
        <ul id="parts" class="list"></ul>
      </section>
      <section class="grow">
        <h2>Timeline</h2>
        <ol id="timeline" class="list"></ol>
      </section>
    </aside>
    <div id="view">
      <div id="view-tools">
        <button id="sketch-button" title="Sketch on a plane, or on the selected flat face">✎ Sketch</button>
        <span id="plane-choice" hidden>on <button data-plane="Plane.XY">Top (XY)</button><button data-plane="Plane.XZ">Front (XZ)</button><button data-plane="Plane.YZ">Right (YZ)</button><span class="muted">or select a flat face first</span></span>
        <button id="export-button" title="Export the part as STEP or STL into the project's exports/">⇩ Export</button>
        <span id="export-choice" hidden>as <button data-format="step" title="STEP: exact geometry, for other CAD programs">STEP</button><button data-format="stl" title="STL: a mesh, for slicers and 3D printing">STL</button></span>
      </div>
      <div id="sketch-panel" hidden></div>
      <div id="feature-panel" hidden></div>
      <div id="overlay">Loading CAD kernel…</div>
      <div id="selection" hidden></div>
      <div id="agent-note" hidden></div>
    </div>
    <div id="right">
      <div class="panel-head"><span id="file-name" class="muted"></span><button id="toggle-code" class="panel-toggle" title="Hide the code">»</button></div>
      <div id="editor"></div>
      <div id="error" hidden></div>
    </div>
  </main>
  <dialog id="agent-dialog"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
