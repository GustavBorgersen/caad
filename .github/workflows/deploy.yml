# Build the agent bridge for every system, bundle it into the site under /bridge/, and deploy to Vercel:
# production on pushes to main, a preview for each pull request. Vercel's own Git builds are off
# (app/vercel.json) because they have no Go toolchain, so every deployment goes through here.
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID. The Vercel project's
# root directory is `app`.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  deploy:
    # Pull requests from forks get no secrets, so they can't deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build bridge (all systems → app/public/bridge)
        run: bridge/build.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test bridge
        working-directory: app
        run: npm run test:bridge
        env:
          CAAD_MCP: ../bridge/dist/caad-mcp-linux-amd64

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build site
        run: |
          vercel pull --yes --environment=$VERCEL_ENV --token=${{ secrets.VERCEL_TOKEN }}
          vercel build $([ "$VERCEL_ENV" = production ] && echo --prod) --token=${{ secrets.VERCEL_TOKEN }}
          ls .vercel/output/static/bridge/caad-mcp-* # the bridge must be in the site

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt $([ "$VERCEL_ENV" = production ] && echo --prod) --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: caad-mcp
          path: bridge/dist/caad-mcp-*
